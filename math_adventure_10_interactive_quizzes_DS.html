<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

      margin: 0;
      padding: 0;
    }

      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1f3a4b;

      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      border-bottom: 4px dashed #a5bec9;
      padding-bottom: 0.65rem;
      margin-bottom: 1.2rem;

      font-weight: 400;
      background: #c7dae3;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      color: #1a2f3b;

      justify-content: space-between;
      align-items: center;

      color: #1f3541;

      gap: 0.3rem;
      flex-wrap: wrap;
      align-items: center;

      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 0.25rem 0.9rem;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.15s;
      color: #1f3a4b;

      background: #2b5c74;
      color: #f5faff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);

    .quiz-btn:hover {
      background: #8badbe;
      color: #0b1f2b;

      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.3px;

      font-size: 1.5rem;
      font-weight: 600;
      color: #142b38;
      line-height: 1.3;
      margin-bottom: 1.2rem;
    }

      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin: 1.2rem 0 1.5rem;
    }

      padding: 0.7rem 1.2rem;
      border-radius: 60px;
      font-size: 1.2rem;
      cursor: pointer;
      border: 2px solid transparent;
      transition: 0.1s ease;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      color: #142b38;
      font-weight: 500;
    }
    .opt:hover {
      background: #d8e6ee;
      border-color: #8badbe;
    }
    .opt.selected {
      background: #c6dbe6;
      border-color: #2b5c74;
      box-shadow: 0 0 0 2px #2b5c74;
    }
    .opt.correct {
      background: #8fc9a8;
      border-color: #1e6a3b;
      color: #05301a;
    }
    .opt.wrong {
      background: #d99c9c;
      border-color: #9f3a3a;
      color: #3f0e0e;
    }
    .opt.disabled {
      pointer-events: none;
      opacity: 0.8;
    }

      background: #e1edf5;
      border-radius: 30px;
      padding: 1rem 1.6rem;
      margin: 0.8rem 0 1.4rem;
      font-size: 1rem;
      border-left: 6px solid #2b5c74;
      color: #1a2f3b;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;

      color: #1a4053;
    }

      max-height: 48px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
      margin-top: 1rem;
    }

      background: #2b5c74;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1.2rem;
      padding: 0.6rem 1.8rem;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 6px 0 #12323f;
      transform: translateY(-2px);
      letter-spacing: 0.5px;

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #12323f;
    }
    .btn:disabled {
      opacity: 0.4;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #12323f;
      pointer-events: none;
    }
    .btn-secondary {
      background: #8badbe;
      box-shadow: 0 6px 0 #587585;
    }
    .progress {
      font-weight: 500;
      background: #d4e3ec;
      padding: 0.3rem 1rem;
      border-radius: 60px;
      color: #1a2f3b;
    }

      text-align: center;
      background: #f0f7fb;
      border-radius: 48px;
      padding: 2rem;
    }

      font-size: 2.8rem;
      color: #1a3342;
    }
    .star {
      font-size: 3rem;
      line-height: 1.2;

    }
  </style>
</head>

      qs.push({ topic: 'Fractions', q: 'Which is equivalent to 2/3?', options: ['4/6', '3/6', '2/6', '5/6'], correct: 0, explain: '2/3 = 4/6 (×2).' });
      qs.push({ topic: 'Fractions', q: 'Add: 1/5 + 2/5 = ?', options: ['3/5', '2/5', '4/5', '1/5'], correct: 0, explain: '1/5 + 2/5 = 3/5 (same denominator).' });
      qs.push({ topic: 'Fractions', q: 'Add: 3/7 + 2/7 = ?', options: ['5/7', '4/7', '6/7', '3/7'], correct: 0, explain: '3/7 + 2/7 = 5/7.' });
      qs.push({ topic: 'Fractions', q: 'Subtract: 5/8 - 2/8 = ?', options: ['3/8', '4/8', '2/8', '5/8'], correct: 0, explain: '5/8 - 2/8 = 3/8.' });
      qs.push({ topic: 'Fractions', q: 'Subtract: 7/10 - 3/10 = ?', options: ['4/10', '5/10', '3/10', '2/10'], correct: 0, explain: '7/10 - 3/10 = 4/10.' });
      qs.push({ topic: 'Fractions', q: 'Compare: 1/4 ___ 3/4', options: ['<', '>', '=', '≤'], correct: 0, explain: '1/4 < 3/4 (same denominator, smaller numerator).' });
      qs.push({ topic: 'Fractions', q: 'Compare: 5/6 ___ 2/6', options: ['>', '<', '=', '≥'], correct: 0, explain: '5/6 > 2/6.' });
      qs.push({ topic: 'Fractions', q: 'Order smallest: 1/3, 1/6, 1/2', options: ['1/6, 1/3, 1/2', '1/3, 1/6, 1/2', '1/2, 1/3, 1/6', '1/6, 1/2, 1/3'], correct: 0, explain: 'Larger denominator = smaller fraction. 1/6 < 1/3 < 1/2.' });
      qs.push({ topic: 'Fractions', q: 'Order largest: 3/4, 1/4, 2/4', options: ['3/4, 2/4, 1/4', '1/4, 2/4, 3/4', '2/4, 3/4, 1/4', '3/4, 1/4, 2/4'], correct: 0, explain: 'Same denominator: 3/4 > 2/4 > 1/4.' });
      qs.push({ topic: 'Fractions', q: 'What is 2/3 of 9?', options: ['6', '3', '4', '5'], correct: 0, explain: '9 ÷ 3 = 3, 3 × 2 = 6.' });
      qs.push({ topic: 'Fractions', q: 'What is 3/4 of 16?', options: ['12', '8', '10', '14'], correct: 0, explain: '16 ÷ 4 = 4, 4 × 3 = 12.' });
      qs.push({ topic: 'Fractions', q: 'Count in tenths: 0.4, 0.5, __, 0.7', options: ['0.6', '0.5', '0.8', '0.4'], correct: 0, explain: '0.4, 0.5, 0.6, 0.7 (add 0.1).' });
      qs.push({ topic: 'Fractions', q: 'Show 1/3 of 12 using a diagram (concept).', options: ['4', '6', '3', '8'], correct: 0, explain: '12 ÷ 3 = 4. 1/3 of 12 is 4.' });
      qs.push({ topic: 'Fractions', q: 'Which is equivalent to 2/4?', options: ['1/2', '1/4', '3/4', '2/3'], correct: 0, explain: '2/4 = 1/2 (divide by 2).' });
      qs.push({ topic: 'Fractions', q: 'Add: 2/9 + 4/9 = ?', options: ['6/9', '5/9', '7/9', '3/9'], correct: 0, explain: '2/9 + 4/9 = 6/9.' });
      qs.push({ topic: 'Fractions', q: 'Subtract: 8/9 - 5/9 = ?', options: ['3/9', '4/9', '2/9', '1/9'], correct: 0, explain: '8/9 - 5/9 = 3/9.' });
      qs.push({ topic: 'Fractions', q: 'Compare: 2/5 ___ 4/5', options: ['<', '>', '=', '≤'], correct: 0, explain: '2/5 < 4/5.' });
      qs.push({ topic: 'Fractions', q: 'Order: 1/4, 1/2, 1/3 (smallest first)', options: ['1/4, 1/3, 1/2', '1/4, 1/2, 1/3', '1/3, 1/4, 1/2', '1/2, 1/4, 1/3'], correct: 0, explain: '1/4 < 1/3 < 1/2.' });
      qs.push({ topic: 'Fractions', q: 'What is 3/5 of 15?', options: ['9', '6', '12', '3'], correct: 0, explain: '15 ÷ 5 = 3, 3 × 3 = 9.' });
      qs.push({ topic: 'Fractions', q: 'What is 4/5 of 20?', options: ['16', '12', '15', '18'], correct: 0, explain: '20 ÷ 5 = 4, 4 × 4 = 16.' });

      // ensure exactly 250
      while (qs.length < 250) {
        qs.push({ topic: 'Place Value', q: 'What is 10 more than 100?', options: ['110', '120', '90', '200'], correct: 0, explain: '100+10=110.' });
      }
      return qs.slice(0, 250);
    }

    const questionBank = buildQuestions();
    const quizzes = [];
    for (let i = 0; i < 10; i++) {
      quizzes.push(questionBank.slice(i * 25, i * 25 + 25));
    }

    // ---------- STATE ----------
    let currentQuiz = 0;
    let currentQuestion = 0;
    let score = 0;
    let selectedOption = null;
    let answered = false;
    let quizCompleted = false;

    const container = document.getElementById('quizContainer');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const quizSelector = document.getElementById('quizSelector');

    // ---------- RENDER ----------
    function renderQuizSelector() {
      quizSelector.innerHTML = '';
      for (let i = 0; i < quizzes.length; i++) {
        const btn = document.createElement('button');
        btn.className = `quiz-btn ${i === currentQuiz ? 'active' : ''}`;
        btn.textContent = i + 1;
        btn.dataset.index = i;
        btn.addEventListener('click', function() {
          switchQuiz(parseInt(this.dataset.index));
        });
        quizSelector.appendChild(btn);
      }
    }

    function renderQuestion() {
      if (quizCompleted) {
        renderFinishScreen();
        return;
      }

      const qData = quizzes[currentQuiz][currentQuestion];
      if (!qData) {
        quizCompleted = true;
        renderFinishScreen();
        return;
      }

      const total = quizzes[currentQuiz].length;
      const progress = `Q ${currentQuestion + 1} / ${total}`;

      let html = `<div class="question-box">`;
      html += `<div class="q-text">${qData.q}</div>`;
      html += `<div class="options-grid">`;
      const letters = ['A', 'B', 'C', 'D'];
      for (let i = 0; i < qData.options.length; i++) {
        let cls = 'opt';
        if (answered) {
          cls += ' disabled';
          if (i === qData.correct) cls += ' correct';
          if (selectedOption === i && i !== qData.correct) cls += ' wrong';
          if (selectedOption === i) cls += ' selected';
        }
        html += `<div class="${cls}" data-optindex="${i}">${letters[i]}. ${qData.options[i]}</div>`;
      }
      html += `</div>`;

      if (answered) {
        html += `<div class="explanation"><strong>💡 Explanation:</strong> ${qData.explain}</div>`;
        const nextBtn = currentQuestion < total - 1 
          ? `<button class="btn" id="nextBtn">Next →</button>`
          : `<button class="btn" id="finishQuizBtn">🏁 Finish Quiz</button>`;
        html += `<div class="action-row"><span class="progress">${progress}</span>${nextBtn}</div>`;
      } else {
        html += `<div class="action-row"><span class="progress">${progress}</span><button class="btn" id="checkAnswerBtn" disabled>✅ Check</button></div>`;
      }

      html += `</div>`;
      container.innerHTML = html;

      if (!answered) {
        const options = container.querySelectorAll('.opt');
        options.forEach(opt => {
          opt.addEventListener('click', function() {
            if (answered) return;
            const idx = parseInt(this.dataset.optindex);
            selectedOption = idx;
            options.forEach(o => o.classList.remove('selected'));
            this.classList.add('selected');
            document.getElementById('checkAnswerBtn').disabled = false;
          });
        });

        document.getElementById('checkAnswerBtn').addEventListener('click', function() {
          if (selectedOption === null || answered) return;
          const q = quizzes[currentQuiz][currentQuestion];
          if (selectedOption === q.correct) score += 4;
          answered = true;
          updateScore();
          renderQuestion();
        });
      } else {
        const nextBtn = document.getElementById('nextBtn');
        if (nextBtn) {
          nextBtn.addEventListener('click', function() {
            currentQuestion++;
            answered = false;
            selectedOption = null;
            renderQuestion();
          });
        }
        const finishBtn = document.getElementById('finishQuizBtn');
        if (finishBtn) {
          finishBtn.addEventListener('click', function() {
            quizCompleted = true;
            renderQuestion();
          });
        }
      }
    }

    function renderFinishScreen() {
      const totalQ = quizzes[currentQuiz].length;
      const maxScore = totalQ * 4;
      const pct = Math.round((score / maxScore) * 100);
      let stars = '';
      if (pct >= 80) stars = '🌟🌟🌟';
      else if (pct >= 60) stars = '🌟🌟';
      else if (pct >= 40) stars = '🌟';
      else stars = '💪 Keep trying!';

      container.innerHTML = `
        <div class="finish-box">
          <div class="star">${stars}</div>
          <h2>🎉 Quiz ${currentQuiz + 1} Complete!</h2>
          <p style="font-size:1.8rem; font-weight:600; margin:0.5rem 0;">${score} / ${maxScore}</p>
          <p style="font-size:1.2rem; margin-bottom:1.2rem;">${pct}% correct</p>
          <button class="btn" id="resetQuizBtn">🔄 Retry this Quiz</button>
          <button class="btn btn-secondary" id="switchQuizBtn" style="margin-left:0.5rem;">📋 Choose Quiz</button>
        </div>
      `;
      document.getElementById('resetQuizBtn').addEventListener('click', function() {
        resetQuiz();
      });
      document.getElementById('switchQuizBtn').addEventListener('click', function() {
        resetQuiz();
      });
    }

    function resetQuiz() {
      currentQuestion = 0;
      score = 0;
      answered = false;
      selectedOption = null;
      quizCompleted = false;
      updateScore();
      renderQuestion();
    }

    function switchQuiz(index) {
      if (index < 0 || index >= quizzes.length) return;
      currentQuiz = index;
      currentQuestion = 0;
      score = 0;
      answered = false;
      selectedOption = null;
      quizCompleted = false;
      updateScore();
      renderQuizSelector();
      renderQuestion();
    }

    function updateScore() {
      scoreDisplay.textContent = `⭐ ${score}`;
    }

    // ---------- INIT ----------
    renderQuizSelector();
    renderQuestion();
    updateScore();

  })();
</script>
</body>
</html>
