<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Adventure - 10 Interactive Quizzes</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}
  .app{max-width:980px;margin:auto;padding:22px}
  header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;border-radius:22px;padding:26px;text-align:center;box-shadow:0 8px 25px #0001}
  h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}
  header p{margin:6px 0}
  .panel{background:white;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 5px 18px #00000012}
  .quiz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:13px 16px}
  .quiz-btn{background:#eef2ff;color:#3730a3;font-weight:bold}
  .quiz-btn:hover{background:#e0e7ff}
  .hidden{display:none}
  .topbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .progress{height:12px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:16px 0}
  .progress>div{height:100%;background:#4f46e5;transition:.25s;width:0}
  .meta{display:flex;gap:10px;flex-wrap:wrap}
  .pill{background:#f1f5f9;padding:7px 11px;border-radius:999px;font-size:14px}
  .question{font-size:25px;line-height:1.35;margin:22px 0}
  .options{display:grid;gap:11px}
  .option{background:#f8fafc;border:2px solid #e2e8f0;text-align:left;transition:.15s}
  .option:hover:not(:disabled){border-color:#818cf8;background:#eef2ff}
  .option.correct{background:#dcfce7;border-color:#16a34a}
  .option.wrong{background:#fee2e2;border-color:#dc2626}
  .option:disabled{cursor:default}
  .feedback{margin-top:16px;padding:16px;border-radius:14px;line-height:1.55}
  .feedback.good{background:#ecfdf5;border:1px solid #86efac}
  .feedback.bad{background:#fff7ed;border:1px solid #fdba74}
  .controls{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  .primary{background:#4f46e5;color:white;font-weight:bold}
  .secondary{background:#e2e8f0;color:#172033}
  .primary:disabled{opacity:.45;cursor:not-allowed}
  .score{text-align:center}
  .score-number{font-size:56px;font-weight:800;color:#4f46e5}
  .review{margin-top:18px}
  .review-item{padding:12px;border-bottom:1px solid #e5e7eb}
  .review-item strong{display:block}
  .small{font-size:14px;color:#64748b}
  .tag{display:inline-block;background:#ede9fe;color:#5b21b6;padding:4px 8px;border-radius:8px;font-size:12px;margin-bottom:7px}
  @media(max-width:600px){.app{padding:12px}.panel{padding:16px}.question{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>🌟 Grammar Adventure!</h1>
  <p>10 fun quizzes • 25 questions each • 4 marks per question</p>
  <p>Choose a quiz and test your grammar skills!</p>
</header>

<section id="home" class="panel">
  <h2>Choose a Quiz</h2>
  <div id="quizGrid" class="quiz-grid"></div>
</section>

<section id="quiz" class="panel hidden">
  <div class="topbar">
    <div><strong id="quizTitle"></strong></div>
    <div class="meta">
      <span class="pill" id="questionCounter"></span>
      <span class="pill">4 marks</span>
    </div>
  </div>
  <div class="progress"><div id="progressBar"></div></div>
  <div id="questionArea"></div>
</section>

<section id="result" class="panel hidden">
  <div class="score">
    <h2 id="resultTitle">Quiz Complete! 🎉</h2>
    <div class="score-number" id="scoreNumber"></div>
    <p id="scoreText"></p>
    <button class="primary" onclick="showHome()">Choose Another Quiz</button>
  </div>
  <div id="review" class="review"></div>
</section>
</div>

hrase identifies a particular book—the one on the table—so “the” is correct."}, {"topic": "Parts of Speech", "question": "Which word is a noun in this sentence? The puppy chased the ball.", "options": ["puppy", "chased", "the", "quickly"], "answer": "puppy", "explanation": "A noun names a person, place, animal, or thing. “Puppy” names an animal, so it is the noun."}, {"topic": "Prefixes", "question": "What does “auto-” suggest in “autopilot”? ", "options": ["self", "against", "again", "not"], "answer": "self", "explanation": "“Auto-” means self or by itself."}, {"topic": "Time Conjunctions", "question": "It was raining, ___ we stayed inside.", "options": ["so", "before", "while", "because"], "answer": "so", "explanation": "“So” shows the result of something. Rain led to staying inside."}, {"topic": "Adverbs", "question": "Which word tells when? He arrived yesterday.", "options": ["arrived", "he", "yesterday", "the"], "answer": "yesterday", "explanation": "“Yesterday” tells when he arrived."}], [{"topic": "Adverbs", "question": "Which word tells where? The children played outside.", "options": ["children", "played", "outside", "the"], "answer": "outside", "explanation": "“Outside” tells where they played."}, {"topic": "Expanded Noun Phrases", "question": "Which is the expanded noun phrase? ", "options": ["butterfly", "blue butterfly", "The big, blue butterfly", "flew"], "answer": "The big, blue butterfly", "explanation": "An expanded noun phrase gives extra information about a noun. “The big, blue butterfly” tells us more about the butterfly."}, {"topic": "Kinds of Sentences", "question": "Which punctuation mark usually ends a question?", "options": [".", "?", "!", "'"], "answer": "?", "explanation": "A question normally ends with a question mark."}, {"topic": "Kinds of Sentences", "question": "What kind of sentence is: “Where is my pencil?”", "options": ["statement", "question", "exclamation", "command"], "answer": "question", "explanation": "It asks something and ends with a question mark, so it is a question."}, {"topic": "Adverbs", "question": "Which word tells when? We will leave soon.", "options": ["we", "leave", "soon", "will"], "answer": "soon", "explanation": "“Soon” tells when we will leave."}, {"topic": "Prepositions", "question": "We stayed indoors ___ the storm.", "options": ["because of", "on", "at", "before"], "answer": "because of", "explanation": "The storm is the reason we stayed indoors, so “because of” fits."}, {"topic": "Time Conjunctions", "question": "It was raining, ___ we stayed inside.", "options": ["so", "before", "while", "because"], "answer": "so", "explanation": "“So” shows the result of something. Rain led to staying inside."}, {"topic": "Expanded Noun Phrases", "question": "Which is an expanded noun phrase? ", "options": ["a tiny, green frog", "jumped high", "frog jumped", "very quickly"], "answer": "a tiny, green frog", "explanation": "It names a frog and uses adjectives to give more information about it."}, {"topic": "Prepositions", "question": "Wash your hands ___ dinner.", "options": ["before", "during", "because of", "at"], "answer": "before", "explanation": "“Before dinner” means earlier than dinner."}, {"topic": "Time Conjunctions", "question": "___ the bell rang, the students left.", "options": ["When", "Because", "So", "While"], "answer": "When", "explanation": "“When” tells us the time at which something happened."}, {"topic": "Adverbs", "question": "Which word tells how? The turtle moved slowly.", "options": ["turtle", "moved", "slowly", "the"], "answer": "slowly", "explanation": "“Slowly” tells how the turtle moved."}, {"topic": "Articles", "question": "Choose the correct article: Please close ___ door.", "options": ["a", "an", "the", "no article"], "answer": "the", "explanation": "“The” is used when we mean a particular or known thing. Here, it is a specific door."}, {"topic": "Apostrophes", "question": "What is the contraction for “I am”?", "options": ["Im", "I'm", "I'am", "I' m"], "answer": "I'm", "explanation": "I am becomes I'm. The apostrophe shows where letters have been left out."}, {"topic": "Parts of Speech", "question": "Which word is a verb? The birds sing in the tree.", "options": ["birds", "sing", "tree", "the"], "answer": "sing", "explanation": "A verb tells what someone or something does. “Sing” tells what the birds do."}, {"topic": "Suffixes", "question": "Which word names the state of being kind? ", "options": ["kindness", "kindful", "kindless", "kindly"], "answer": "kindness", "explanation": "The suffix “-ness” can turn an adjective into a noun naming a state or quality."}, {"topic": "Prefixes", "question": "What does “anti-” mean? ", "options": ["against", "again", "very", "self"], "answer": "against", "explanation": "“Anti-” means against."}, {"topic": "Prefixes", "question": "What does “super-” mean in “superfast”? ", "options": ["very or above", "not", "again", "against"], "answer": "very or above", "explanation": "“Super-” can mean very, extra, or above."}, {"topic": "Kinds of Sentences", "question": "What kind of sentence is: “The cat is sleeping.”", "options": ["statement", "question", "exclamation", "command"], "answer": "statement", "explanation": "It gives information, so it is a statement."}, {"topic": "Apostrophes", "question": "Which shows possession by one girl named Mia?", "options": ["Mias bag", "Mia's bag", "Mias' bag", "Mia bag's"], "answer": "Mia's bag", "explanation": "For one person, add ’s to show that something belongs to them: Mia's bag."}, {"topic": "Apostrophes", "question": "What is the contraction for “do not”?", "options": ["dont", "don't", "do'nt", "doesn't"], "answer": "don't", "explanation": "An apostrophe replaces the missing letters in a contraction: do not → don't."}, {"topic": "Expanded Noun Phrases", "question": "Choose the most detailed noun phrase for “flower.”", "options": ["flower", "the flower", "the beautiful yellow flower", "grew"], "answer": "the beautiful yellow flower", "explanation": "The phrase gives extra information about the flower using “beautiful” and “yellow.”"}, {"topic": "Articles", "question": "Choose the correct article: She has ___ blue bag.", "options": ["a", "an", "the", "no article"], "answer": "a", "explanation": "Use “a” before a singular noun beginning with a consonant sound. “Blue” begins with /b/."}, {"topic": "Prepositions", "question": "I saw her ___ Monday.", "options": ["on", "at", "during", "because of"], "answer": "on", "explanation": "We use “on” with days and dates."}, {"topic": "Parts of Speech", "question": "Which word is a noun in this sentence? The puppy chased the ball.", "options": ["puppy", "chased", "the", "quickly"], "answer": "puppy", "explanation": "A noun names a person, place, animal, or thing. “Puppy” names an animal, so it is the noun."}, {"topic": "Suffixes", "question": "Which word means an action or result connected with develop? ", "options": ["developful", "development", "developless", "developly"], "answer": "development", "explanation": "The suffix “-ment” often forms nouns from verbs. Develop + ment = development."}]];
let currentQuiz = 0, currentQuestion = 0, score = 0, answered = false, userAnswers = [];

const grid = document.getElementById('quizGrid');
quizzes.forEach((_, i) => {
  const b = document.createElement('button');
  b.className = 'quiz-btn';
  b.textContent = `Quiz ${i+1} — 25 Questions`;
  b.onclick = () => startQuiz(i);
  grid.appendChild(b);
});

function showHome(){
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
}
function startQuiz(i){
  currentQuiz=i; currentQuestion=0; score=0; answered=false; userAnswers=[];
  document.getElementById('home').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('quizTitle').textContent=`Quiz ${i+1}`;
  renderQuestion();
}
function renderQuestion(){
  answered=false;
  const q=quizzes[currentQuiz][currentQuestion];
  document.getElementById('questionCounter').textContent=`Question ${currentQuestion+1} of 25`;
  document.getElementById('progressBar').style.width=`${((currentQuestion+1)/25)*100}%`;
  const area=document.getElementById('questionArea');
  area.innerHTML='';
  const tag=document.createElement('div'); tag.className='tag'; tag.textContent=q.topic;
  const h=document.createElement('div'); h.className='question'; h.textContent=q.question;
  const opts=document.createElement('div'); opts.className='options';
  q.options.forEach(opt=>{
    const b=document.createElement('button');
    b.className='option'; b.textContent=opt;
    b.onclick=()=>answerQuestion(opt,b,opts);
    opts.appendChild(b);
  });
  area.append(tag,h,opts);
}
function answerQuestion(selected, clicked, opts){
  if(answered)return;
  answered=true;
  const q=quizzes[currentQuiz][currentQuestion];
  const correct=selected===q.answer;
  if(correct)score+=4;
  userAnswers.push({selected, correct, answer:q.answer, explanation:q.explanation});
  [...opts.children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.answer)b.classList.add('correct');
  });
  if(!correct)clicked.classList.add('wrong');
  const fb=document.createElement('div');
  fb.className='feedback '+(correct?'good':'bad');
  fb.innerHTML=`<strong>${correct?'✅ Correct! +4 marks':'❌ Not quite.'}</strong><br>
    <b>Correct answer:</b> ${escapeHtml(q.answer)}<br>
    <b>Explanation:</b> ${escapeHtml(q.explanation)}`;
  const controls=document.createElement('div'); controls.className='controls';
  const next=document.createElement('button'); next.className='primary';
  next.textContent=currentQuestion===24?'See My Score 🎉':'Next Question →';
  next.onclick=()=>{ if(currentQuestion===24)showResult(); else {currentQuestion++;renderQuestion();} };
  controls.appendChild(next);
  fb.appendChild(controls);
  document.getElementById('questionArea').appendChild(fb);
}
function showResult(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  const max=25*4;
  document.getElementById('scoreNumber').textContent=`${score} / ${max}`;
  const percent=Math.round(score/max*100);
  let msg=percent>=90?'Amazing work! 🌟':percent>=75?'Great job! 👏':percent>=50?'Good effort! Keep practising! 💪':'Keep learning—you can do it! 🌈';
  document.getElementById('scoreText').textContent=`You scored ${percent}%. ${msg}`;
  const review=document.getElementById('review');
  review.innerHTML='<h3>Answer Review</h3>';
  userAnswers.forEach((a,i)=>{
    const d=document.createElement('div'); d.className='review-item';
    d.innerHTML=`<strong>${i+1}. ${a.correct?'✅':'❌'} ${a.correct?'Correct':'Needs practice'}</strong>
      <span class="small">Your answer: ${escapeHtml(a.selected)} • Correct: ${escapeHtml(a.answer)}</span>
      <div>${escapeHtml(a.explanation)}</div>`;
    review.appendChild(d);
  });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
