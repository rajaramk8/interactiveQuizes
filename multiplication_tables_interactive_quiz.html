<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiplication Tables Quiz</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2ff;margin:0;color:#172033}
.container{max-width:1100px;margin:25px auto;padding:15px}.card{background:#fff;padding:25px;border-radius:18px;box-shadow:0 6px 20px #0001;margin-bottom:20px}
h1{text-align:center;color:#3730a3}.subtitle{text-align:center;color:#64748b}
.grid{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));column-gap:24px;row-gap:12px;width:100%} .grid span{display:block;min-width:0}
.grid label{
display:flex;
align-items:center;
gap:12px;
width:100%;
min-height:52px;
padding:10px 16px;
text-align:left;
border:2px solid #ddd;
border-radius:10px;
cursor:pointer;
font-weight:bold;
background:#f8fafc;
white-space:nowrap
}
 .grid input{position:absolute;opacity:0;pointer-events:none}
.grid label::before{
content:"";
width:20px;
height:20px;
flex:0 0 20px;
border:2px solid #6366f1;
border-radius:4px;
background:white
}
.grid input:checked+label{
background:#4f46e5;
color:white;
border-color:#4f46e5
}
.grid input:checked+label::before{
background:white;
box-shadow:inset 0 0 0 4px #4f46e5
}
button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:bold;cursor:pointer}.primary{background:#4f46e5;color:white}.secondary{background:#e2e8f0}
.controls{display:flex;gap:10px;margin:15px 0}.setup-number{padding:10px;width:100px;font-size:18px;border:2px solid #ddd;border-radius:8px}
.hidden{display:none}.quizhead{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.timer{background:#fef3c7;padding:10px 15px;border-radius:20px;font-weight:bold}
.progress{height:9px;background:#e5e7eb;border-radius:9px;margin:18px 0}.bar{height:100%;background:#4f46e5;width:0}
.question{font-size:27px;font-weight:bold;padding:20px;border:2px solid #e5e7eb;border-radius:14px;margin:12px 0;background:#fafafa}
.answer{width:120px;padding:9px;font-size:24px;text-align:center;border:2px solid #cbd5e1;border-radius:8px}
.error{color:#dc2626;font-weight:bold}.score{text-align:center;font-size:58px;color:#4f46e5;font-weight:bold}.review-item{padding:14px;border-bottom:1px solid #ddd}.correct{background:#ecfdf5}.wrong{background:#fff1f2}.time{display:inline-block;margin-top:7px;background:#e0e7ff;color:#3730a3;padding:5px 9px;border-radius:7px;font-weight:bold;font-size:14px}
@media(max-width:800px){
.grid{grid-template-columns:repeat(3,minmax(120px,1fr));column-gap:14px}
}
@media(max-width:600px){
.grid{grid-template-columns:repeat(2,minmax(120px,1fr));column-gap:12px}
.question{font-size:22px}
}
@media(max-width:380px){
.grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">

<div class="card" id="setup">
<h1>✖️ Multiplication Tables Quiz</h1>
<p class="subtitle">×1 and ×10 are excluded. Multipliers are 2–9, 11 and 12.</p>
<h2>Select Tables</h2>
<div class="controls">
<button class="secondary" onclick="allTables()">Select All</button>
<button class="secondary" onclick="noTables()">Clear All</button>
</div>
<div class="grid" id="tables"></div>
<h2>Number of Questions</h2>
<input class="setup-number" id="count" type="number" min="1" max="100" value="10">
<div class="error" id="error"></div>
<p><button class="primary" onclick="start()">🚀 Start Quiz</button></p>
</div>

<div class="card hidden" id="quiz">
<div class="quizhead"><div><h2>Multiplication Quiz</h2><div id="info"></div></div><div class="timer">⏱️ <span id="clock">00:00</span></div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="questions"></div>
<p><button class="secondary" onclick="cancelQuiz()">← Cancel</button>
<button class="primary" onclick="finish()">🏁 Finish Quiz</button></p>
</div>

<div class="card hidden" id="result">
<h1>🎉 Quiz Complete!</h1>
<div class="score" id="percent"></div>
<h2 style="text-align:center">Total time: <span id="totalTime"></span></h2>
<p style="text-align:center" id="message"></p>
<p style="text-align:center"><button class="primary" onclick="newQuiz()">🔄 New Quiz</button></p>
<h2>Question-by-question results</h2>
<div id="review"></div>
</div>
</div>

<script>
let qs=[],startTime=0,timer=null,finished=false;

for(let i=1;i<=20;i++){
  tables.insertAdjacentHTML("beforeend",
    '<span><input type="checkbox" id="t'+i+'" value="'+i+'"><label for="t'+i+'">'+i+' ×</label></span>');
}

function allTables(){document.querySelectorAll("#tables input").forEach(x=>x.checked=true)}
function noTables(){document.querySelectorAll("#tables input").forEach(x=>x.checked=false)}

function start(){
  error.textContent="";
  const selected=[...document.querySelectorAll("#tables input:checked")].map(x=>+x.value);
  const n=+count.value;
  if(!selected.length){error.textContent="Please select at least one table.";return}
  if(!Number.isInteger(n)||n<1||n>100){error.textContent="Enter 1 to 100 questions.";return}

  const multipliers=[2,3,4,5,6,7,8,9,11,12];
  /*
     Generate UNIQUE questions.

     A question is considered a duplicate when the same
     table and multiplier appear again.

     Example:
       6 × 7 and 6 × 7  -> duplicate
       8 × 12 and 8 × 12 -> duplicate

     We also avoid generating more questions than are
     mathematically possible for the selected tables.
  */
  const possibleQuestions = [];

  selected.forEach(table => {
    multipliers.forEach(multiplier => {
      possibleQuestions.push({table, multiplier});
    });
  });

  if(n > possibleQuestions.length){
    error.textContent =
      "You can select up to " + possibleQuestions.length +
      " unique questions with the tables you selected.";
    return;
  }

  /*
     Shuffle the complete list first, then take the
     requested number. This guarantees no duplicates.
  */
  for(let i=possibleQuestions.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [possibleQuestions[i],possibleQuestions[j]] =
      [possibleQuestions[j],possibleQuestions[i]];
  }

  qs = possibleQuestions.slice(0,n).map(q => ({
    table:q.table,
    multiplier:q.multiplier,
    answer:q.table*q.multiplier,
    shown:null,
    time:null
  }));

  setup.classList.add("hidden"); result.classList.add("hidden"); quiz.classList.remove("hidden");
  info.textContent=n+" questions • Tables: "+selected.join(", ");
  render();
  startTime=Date.now(); clearInterval(timer); timer=setInterval(updateClock,1000); updateClock();
}

function render(){
  questions.innerHTML="";
  qs.forEach((q,i)=>{
    q.shown=Date.now();
    questions.insertAdjacentHTML("beforeend",
      '<div class="question"><div style="font-size:14px;color:#64748b;margin-bottom:8px">Question '+(i+1)+' of '+qs.length+'</div>'+
      q.table+" × "+q.multiplier+" = "+
      '<input class="answer" id="a'+i+'" type="number" inputmode="numeric" autocomplete="off" data-i="'+i+'"></div>');
  });

  document.querySelectorAll(".answer").forEach(inp=>{
    inp.addEventListener("input",()=>{recordTime(+inp.dataset.i);progress()});
    inp.addEventListener("keydown",e=>{
      if(e.key==="Enter"){
        e.preventDefault();recordTime(+inp.dataset.i);
        const i=+inp.dataset.i;
        if(i<qs.length-1) document.getElementById("a"+(i+1)).focus();
        else finish();
      }
    });
  });
  document.getElementById("a0").focus();progress();
}

function recordTime(i){
  if(qs[i].time!==null)return;
  const inp=document.getElementById("a"+i);
  if(inp.value.trim()!=="") qs[i].time=(Date.now()-qs[i].shown)/1000;
}

function progress(){
  const answered=[...document.querySelectorAll(".answer")].filter(x=>x.value.trim()!=="").length;
  bar.style.width=(answered/qs.length*100)+"%";
}

function updateClock(){
  clock.textContent=format(Math.floor((Date.now()-startTime)/1000));
}

function format(s){
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}

function finish(){
  if(finished)return;
  qs.forEach((q,i)=>recordTime(i));
  finished=true;clearInterval(timer);

  const total=Math.floor((Date.now()-startTime)/1000);
  let correct=0,reviewHTML="";

  qs.forEach((q,i)=>{
    const val=document.getElementById("a"+i).value.trim();
    const ok=val!==""&&Number(val)===q.answer;
    if(ok)correct++;

    const qt=q.time===null?"Not answered":q.time.toFixed(1)+" seconds";

    reviewHTML+=
      '<div class="review-item '+(ok?"correct":"wrong")+'">'+
      '<b>'+(i+1)+'. '+q.table+" × "+q.multiplier+" "+(ok?"✅":"❌")+'</b><br>'+
      'Your answer: <b>'+(val===""?"Not answered":escapeHTML(val))+'</b><br>'+
      'Correct answer: <b>'+q.answer+'</b><br>'+
      '<span class="time">⏱️ Time for this question: '+qt+'</span>'+
      '</div>';
  });

  const pct=Math.round(correct/qs.length*100);
  quiz.classList.add("hidden");result.classList.remove("hidden");
  percent.textContent=pct+"%";
  totalTime.textContent=format(total);
  message.textContent=correct+" out of "+qs.length+" correct. "+
    (pct===100?"🌟 Perfect!":pct>=90?"🏆 Excellent!":pct>=75?"👏 Great job!":pct>=50?"💪 Good effort!":"🌈 Keep practising!");
  review.innerHTML=reviewHTML;
}

function cancelQuiz(){
  if(confirm("Leave this quiz? Your answers will be lost."))newQuiz();
}
function newQuiz(){
  clearInterval(timer);quiz.classList.add("hidden");result.classList.add("hidden");setup.classList.remove("hidden");finished=false;
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script>
</body>
</html>
