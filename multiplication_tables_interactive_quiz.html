<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiplication Tables Quiz</title><style>
body{font-family:Arial;margin:0;background:#f3f6fb;color:#172033}.wrap{max-width:900px;margin:25px auto;padding:15px}.card{background:white;padding:25px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-bottom:18px}h1{text-align:center;color:#3730a3}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.grid label{display:block;padding:12px;text-align:center;border:2px solid #ddd;border-radius:10px;cursor:pointer}.grid input{display:none}.grid input:checked+label{background:#4f46e5;color:white;border-color:#4f46e5}.row{margin:20px 0}.row input{padding:10px;font-size:18px;width:100px}.btn{border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:bold;cursor:pointer}.primary{background:#4f46e5;color:white}.secondary{background:#e2e8f0}.hidden{display:none}.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}.timer{background:#fef3c7;padding:10px 15px;border-radius:20px;font-weight:bold}.progress{height:10px;background:#e5e7eb;border-radius:10px;margin:18px 0;overflow:hidden}.bar{height:100%;background:#4f46e5;width:0}.q{font-size:25px;font-weight:bold;padding:18px;border:2px solid #e5e7eb;border-radius:14px;margin:12px 0}.ans{width:110px;padding:9px;font-size:22px;text-align:center;border:2px solid #bbb;border-radius:8px}.nav{text-align:right;margin-top:20px}.score{text-align:center;font-size:60px;color:#4f46e5;font-weight:bold}.review div{padding:12px;border-bottom:1px solid #ddd}.good{background:#ecfdf5}.bad{background:#fff1f2}.error{color:#c00;margin-top:10px}@media(max-width:600px){.grid{grid-template-columns:repeat(4,1fr)}.q{font-size:21px}}
</style></head><body><div class="wrap">
<div class="card" id="setup"><h1>✖️ Multiplication Tables Quiz</h1><p>Select the tables and number of questions.</p><h2>1. Tables</h2><button class="btn secondary" onclick="allTables(true)">Select All</button> <button class="btn secondary" onclick="allTables(false)">Clear All</button><div class="grid" id="tables"></div><h2>2. Number of Questions</h2><div class="row"><input id="count" type="number" min="1" max="100" value="10"> questions</div><div id="error" class="error"></div><button class="btn primary" onclick="start()">🚀 Submit & Start Quiz</button></div>
<div class="card hidden" id="quiz"><div class="top"><h2>Multiplication Quiz</h2><div class="timer">⏱️ <span id="clock">00:00</span></div></div><div id="info"></div><div class="progress"><div class="bar" id="bar"></div></div><div id="qs"></div><div class="nav"><button class="btn primary" onclick="finish()">🏁 Finish Quiz</button></div></div>
<div class="card hidden" id="result"><h1>🎉 Quiz Complete!</h1><div class="score" id="score"></div><h2 style="text-align:center">Time taken: <span id="time"></span></h2><p id="message" style="text-align:center;font-size:19px"></p><div class="review"><h2>Answer Review</h2><div id="review"></div></div><p style="text-align:center"><button class="btn primary" onclick="newQuiz()">🔄 New Quiz</button></p></div>
</div><script>
const tables=document.getElementById('tables');for(let i=1;i<=20;i++){tables.innerHTML+=`<span><input id="t${i}" type="checkbox" value="${i}"><label for="t${i}">${i} ×</label></span>`}
let qs=[],startTime,timer,done=false;function allTables(v){document.querySelectorAll('#tables input').forEach(x=>x.checked=v)}
function start(){let selected=[...document.querySelectorAll('#tables input:checked')].map(x=>+x.value),n=+document.getElementById('count').value;let err=document.getElementById('error');if(!selected.length){err.textContent='Please select at least one table.';return}if(!Number.isInteger(n)||n<1||n>100){err.textContent='Please enter between 1 and 100 questions.';return}err.textContent='';qs=[];for(let i=0;i<n;i++){let a=selected[Math.floor(Math.random()*selected.length)],b=Math.floor(Math.random()*12)+1;qs.push({a,b,answer:a*b})}document.getElementById('setup').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('info').textContent=`${n} questions • Tables: ${selected.join(', ')}`;render();startTime=Date.now();clearInterval(timer);timer=setInterval(tick,1000);tick()}
function render(){let c=document.getElementById('qs');c.innerHTML='';qs.forEach((q,i)=>{c.innerHTML+=`<div class="q"><small>Question ${i+1} of ${qs.length}</small><br>${q.a} × ${q.b} = <input class="ans" id="a${i}" type="number" inputmode="numeric"></div>`});document.querySelectorAll('.ans').forEach((x,i)=>{x.addEventListener('input',progress);x.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(i<qs.length-1)document.getElementById('a'+(i+1)).focus();else finish()}})});document.getElementById('a0').focus();progress()}
function progress(){let filled=[...document.querySelectorAll('.ans')].filter(x=>x.value.trim()!=='').length;document.getElementById('bar').style.width=(filled/qs.length*100)+'%'}function tick(){document.getElementById('clock').textContent=fmt(Math.floor((Date.now()-startTime)/1000))}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function finish(){if(done)return;done=true;clearInterval(timer);let elapsed=Math.floor((Date.now()-startTime)/1000),correct=0,review='';qs.forEach((q,i)=>{let v=document.getElementById('a'+i).value.trim(),ok=v!==''&&Number(v)===q.answer;if(ok)correct++;review+=`<div class="${ok?'good':'bad'}"><b>${i+1}. ${q.a} × ${q.b}</b> ${ok?'✅':'❌'}<br>Your answer: ${v||'Not answered'}<br>Correct answer: ${q.answer}</div>`});let pct=Math.round(correct/qs.length*100);document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('score').textContent=pct+'%';document.getElementById('time').textContent=fmt(elapsed);document.getElementById('message').textContent=`${correct} out of ${qs.length} correct. ${pct===100?'🌟 Perfect!':pct>=90?'🏆 Excellent!':pct>=75?'👏 Great job!':pct>=50?'💪 Good effort!':'🌈 Keep practising!'}`;document.getElementById('review').innerHTML=review}
function newQuiz(){clearInterval(timer);done=false;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('setup').classList.remove('hidden')}
</script></body></html>
